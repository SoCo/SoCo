---
name: SoCo

on:
  push:
    branches:
      - master
      - 'v0.31.fixes'
  pull_request:
    branches:
      - master
      - 'v0.31.fixes'

jobs:
  SoCo-Check-Jobs:
    name: SoCo Check Jobs (${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          sudo apt-get install graphviz libxml2-dev libxslt-dev python3-dev
          python -m pip install --upgrade pip
          pip install -e ".[music-services]"
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Lint with flake8 and pylint
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 soco
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          pylint soco
      - name: Test with pytest
        run: |
          pytest --cov-config .coveragerc --cov soco .
      - name: Test formatting with Black
        if: >-
          ${{ startsWith(matrix.python-version, '3.1') }}
        run: |
          black --check soco tests
      - name: Test documentation build
        if: matrix.python-version == '3.11'
        run: |
          make docs

  Wheel-Install-Check:
    name: Build wheel, install it, import every public package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.11"
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
      - name: Import every public package from the installed wheel
        # Source-tree tests and editable installs do not catch missing
        # subpackages in the built artifact; the installed wheel is the
        # ground truth.
        working-directory: /tmp
        run: |
          /tmp/wheel-venv/bin/python -c "import soco, soco.plugins, soco.music_services, soco.music_services.browser"
